<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ID Card Management | Physical Security</title>
  <style>
    :root{--green:#00843d;--green-dark:#006b31;--black:#171717;--muted:#6f7471;--bg:#f5f7f6;--border:#e1e5e2;--danger:#c62828}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--black)}
    .login-card{width:min(430px,calc(100% - 32px));background:#fff;border:1px solid var(--border);border-radius:14px;padding:34px;box-shadow:0 8px 30px rgba(0,0,0,.07)}
    .logo{display:block;max-width:170px;max-height:80px;margin:0 auto 24px;object-fit:contain}
    h1{font-size:24px;text-align:center;margin:0 0 7px}.subtitle{text-align:center;color:var(--muted);margin:0 0 28px;font-size:15px}
    label{display:block;font-size:14px;font-weight:700;margin:0 0 8px}.field{margin-bottom:18px}input{width:100%;padding:13px 14px;border:1px solid var(--border);border-radius:8px;font-size:15px;outline:none}input:focus{border-color:var(--green)}
    button{width:100%;border:0;border-radius:8px;padding:13px;background:var(--green);color:#fff;font-size:15px;font-weight:700;cursor:pointer}button:hover{background:var(--green-dark)}
    .error{display:none;margin:0 0 16px;padding:11px 12px;border-radius:7px;background:#fdeaea;color:var(--danger);font-size:14px}.error.show{display:block}
    .footer{text-align:center;color:var(--muted);font-size:12px;margin-top:22px}
  </style>
</head>
<body>
  <main class="login-card">
    <img class="logo" src="assets/gbb-logo.svg" alt="GBB" onerror="this.style.display='none'">
    <h1>ID Card Management</h1>
    <p class="subtitle">Physical Security Portal</p>
    <div id="error" class="error"></div>
    <form id="loginForm">
      <div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="username" required></div>
      <div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required></div>
      <button type="submit">Login</button>
    </form>
    <div class="footer">GBB Physical Security</div>
  </main>
  <script>
    fetch('/api/me', { credentials:'same-origin' }).then(r => { if (r.ok) location.href='/dashboard.html'; }).catch(()=>{});
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const error = document.getElementById('error'); error.classList.remove('show');
      const button = e.currentTarget.querySelector('button'); button.disabled = true; button.textContent = 'Logging in...';
      try {
        const response = await fetch('/api/login', {method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({email:document.getElementById('email').value,password:document.getElementById('password').value})});
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Invalid email or password.');
        location.href='/dashboard.html';
      } catch (err) { error.textContent = err.message; error.classList.add('show'); button.disabled=false; button.textContent='Login'; }
    });
  </script>
</body>
</html>
