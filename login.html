<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ID Card Management System</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            min-height: 100vh;
            background: #ffffff;

            display: flex;
            align-items: center;
            justify-content: center;
        }


        /* LOGIN CONTAINER */

        .login-container {
            width: 100%;
            max-width: 460px;
            padding: 40px;
        }


        /* GBB LOGO */

        .logo {
            text-align: center;
            margin-bottom: 28px;
        }

        .logo img {
            width: 120px;
            height: auto;
            display: block;
            margin: 0 auto;
        }


        /* TITLE */

        .title {
            text-align: center;

            font-size: 30px;
            font-weight: 500;

            color: #222222;

            margin-bottom: 42px;
        }


        /* FORM */

        .form-group {
            margin-bottom: 24px;
        }


        .form-group label {
            display: block;

            font-size: 16px;
            font-weight: 500;

            color: #222222;

            margin-bottom: 9px;
        }


        .form-group input {
            width: 100%;
            height: 54px;

            padding: 0 16px;

            border: 1px solid #d3d6d4;
            border-radius: 6px;

            background: #ffffff;

            font-size: 16px;
            color: #222222;

            outline: none;
        }


        .form-group input:focus {
            border-color: #0f6f35;
        }


        /* LOGIN BUTTON */

        .login-button {
            width: 100%;
            height: 54px;

            margin-top: 8px;

            border: none;
            border-radius: 6px;

            background: #0f6f35;
            color: #ffffff;

            font-size: 16px;
            font-weight: 500;

            cursor: pointer;
        }


        .login-button:hover {
            background: #0b5c2c;
        }


        /* ERROR MESSAGE */

        .error-message {
            display: none;

            margin-top: 16px;
            padding: 12px;

            border-radius: 6px;

            background: #fceaea;
            color: #b42318;

            font-size: 14px;
            text-align: center;
        }


        /* MOBILE */

        @media (max-width: 600px) {

            .login-container {
                padding: 30px 25px;
            }

            .title {
                font-size: 26px;
            }

        }

    </style>
</head>


<body>


    <div class="login-container">


        <!-- GBB LOGO -->

        <div class="logo">

            <img
                src="assets/gbb-logo.svg"
                alt="GBB Logo"
            >

        </div>


        <!-- TITLE -->

        <h1 class="title">
            ID Card Management System
        </h1>


        <!-- LOGIN FORM -->

        <form id="loginForm">


            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button
                type="submit"
                class="login-button"
            >
                Login
            </button>


            <div
                id="errorMessage"
                class="error-message"
            >
                Invalid email or password.
            </div>


        </form>


    </div>


    <script src="script.js"></script>

</body>
</html>
